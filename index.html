<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b11" />
  <link rel="manifest" href="/manifest.json" />
  <title>TYON-V45 // MINI PLAYER COOK45 + NIKO</title>
  <style id="playerStyles">
    :root {
      --bg: #05070b;
      --chassis-top: #151d2c;
      --chassis-bot: #0b0f18;
      --panel: #111826;
      --border: #25334d;
      --border-glow: rgba(0, 255, 157, 0.25);
      --neon: #00ff9d;
      --amber: #ffae00;
      --danger: #ff3b5c;
      --cyan: #00d2ff;
      --text: #f1f5f9;
      --muted: #8494ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'JetBrains Mono', 'Segoe UI', monospace;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #111a2e 0%, #05070b 75%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 10px;
    }

    /* Quando está dentro da janela destacada (PiP ou Popup), ocupa 100% justo */
    body.floating-mode {
      padding: 4px;
      justify-content: flex-start;
      background: #070a10;
    }

    .player-wrapper {
      width: 100%;
      max-width: 362px;
      position: relative;
      transition: transform 0.06s linear;
    }

    /* Botão Destacar no Topo (Some quando já está na janelinha destacada) */
    .popout-banner {
      width: 100%;
      margin-bottom: 10px;
      background: linear-gradient(90deg, rgba(0, 255, 157, 0.16) 0%, rgba(0, 210, 255, 0.16) 100%);
      border: 1.5px solid var(--neon);
      border-radius: 10px;
      padding: 9px 12px;
      color: #fff;
      font-size: 0.74rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.22);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .popout-banner:hover {
      background: linear-gradient(90deg, rgba(0, 255, 157, 0.28) 0%, rgba(0, 210, 255, 0.28) 100%);
      transform: translateY(-1px);
      box-shadow: 0 0 28px rgba(0, 255, 157, 0.4);
    }

    body.floating-mode .popout-banner {
      display: none;
    }

    /* Chassi Metálico do Mini-Player */
    .player-shell {
      width: 100%;
      background: linear-gradient(180deg, var(--chassis-top) 0%, var(--chassis-bot) 100%);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.92),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset,
        0 0 25px rgba(0, 255, 157, 0.06);
      position: relative;
    }

    /* Parafusos táticos */
    .screw {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #232f46;
      border: 1px solid #080b11;
      position: absolute;
    }
    .screw.tl { top: 7px; left: 7px; }
    .screw.tr { top: 7px; right: 7px; }
    .screw.bl { bottom: 7px; left: 7px; }
    .screw.br { bottom: 7px; right: 7px; }

    /* Barra de Título Arrastável */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 9px;
      cursor: move;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 12px var(--neon);
      flex-shrink: 0;
    }
    .led.speaking {
      background: var(--amber);
      box-shadow: 0 0 18px var(--amber);
      animation: pulse 0.38s infinite alternate;
    }
    .led.off {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    @keyframes pulse {
      from { opacity: 0.65; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.22); }
    }

    .brand-title {
      font-size: 0.82rem;
      font-weight: bold;
      color: #fff;
      letter-spacing: 0.6px;
    }
    .brand-sub {
      font-size: 0.63rem;
      color: var(--neon);
      display: block;
      margin-top: 1px;
    }

    .top-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: #182233;
      border: 1px solid #2c3d5b;
      color: var(--cyan);
      border-radius: 6px;
      padding: 4px 7px;
      font-size: 0.67rem;
      cursor: pointer;
      font-weight: bold;
      transition: 0.15s;
    }
    .icon-btn:hover {
      border-color: var(--cyan);
      background: #223049;
    }
    .icon-btn.active {
      background: rgba(0, 255, 157, 0.16);
      border-color: var(--neon);
      color: var(--neon);
    }

    /* Visor LCD + Osciloscópio + Barras de Espectro */
    .lcd-screen {
      background: linear-gradient(180deg, #03060a 0%, #070d16 100%);
      border: 1px solid #1d3142;
      border-radius: 9px;
      height: 82px;
      position: relative;
      overflow: hidden;
      margin-bottom: 9px;
      box-shadow: inset 0 0 18px rgba(0, 255, 157, 0.08);
    }

    canvas#miniScope {
      width: 100%;
      height: 100%;
      display: block;
    }

    .lcd-info {
      position: absolute;
      top: 5px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 0.63rem;
      font-weight: bold;
      color: var(--neon);
      pointer-events: none;
      text-shadow: 0 0 6px rgba(0, 255, 157, 0.5);
    }

    .lcd-marquee {
      position: absolute;
      bottom: 5px;
      left: 7px;
      right: 7px;
      font-size: 0.69rem;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      background: rgba(5, 9, 15, 0.82);
      border-left: 2px solid var(--neon);
      padding: 2px 6px;
      border-radius: 0 4px 4px 0;
    }

    /* Botões Principais de Media Player */
    .transport-bar {
      display: grid;
      grid-template-columns: 1.15fr 1.15fr 0.9fr 0.85fr;
      gap: 5px;
      margin-bottom: 8px;
    }

    .t-btn {
      background: #1a2334;
      color: #fff;
      border: 1px solid #304160;
      border-radius: 7px;
      padding: 8px 4px;
      font-size: 0.68rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.15s ease;
    }
    .t-btn:hover {
      transform: translateY(-1px);
      border-color: var(--cyan);
      background: #233047;
    }
    .t-btn.play {
      background: rgba(0, 255, 157, 0.15);
      border-color: var(--neon);
      color: var(--neon);
    }
    .t-btn.niko {
      background: rgba(0, 210, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .t-btn.stop {
      background: rgba(255, 59, 92, 0.16);
      border-color: var(--danger);
      color: #ff7088;
    }

    /* Barra Rápida de Switches */
    .quick-toggles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .q-pill {
      background: #0c111a;
      border: 1px solid #202c42;
      border-radius: 6px;
      padding: 6px 3px;
      text-align: center;
      font-size: 0.62rem;
      color: var(--muted);
      cursor: pointer;
      transition: 0.15s;
    }
    .q-pill.on {
      background: rgba(0, 255, 157, 0.12);
      border-color: var(--neon);
      color: var(--neon);
      font-weight: bold;
    }
    .q-pill.on-niko {
      background: rgba(0, 210, 255, 0.14);
      border-color: var(--cyan);
      color: var(--cyan);
      font-weight: bold;
    }

    /* Corpo Retrátil para o Modo Pocket */
    #expandableBody.collapsed {
      display: none;
    }

    /* Abas das Gavetas */
    .tabs-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-bottom: 8px;
    }

    .tab-btn {
      background: #0f1520;
      border: 1px solid #222d42;
      color: var(--muted);
      padding: 6px 4px;
      font-size: 0.67rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.15s;
    }
    .tab-btn.active {
      background: #1b263b;
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .drawer {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .drawer.open {
      display: block;
    }

    .ctrl-row {
      margin-bottom: 8px;
    }
    .ctrl-row:last-child {
      margin-bottom: 0;
    }
    .ctrl-row label {
      display: flex;
      justify-content: space-between;
      font-size: 0.67rem;
      color: var(--muted);
      margin-bottom: 3px;
    }

    select, textarea {
      width: 100%;
      background: #080c13;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 8px;
      font-size: 0.72rem;
      outline: none;
      user-select: text;
    }
    select:focus, textarea:focus {
      border-color: var(--neon);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--neon);
      height: 14px;
      cursor: pointer;
    }

    textarea#miniText {
      height: 68px;
      resize: none;
      margin-bottom: 6px;
    }

    .hist-box {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .h-item {
      background: #0a0f18;
      border: 1px solid #1e293d;
      border-radius: 5px;
      padding: 6px 8px;
      font-size: 0.69rem;
    }
    .h-meta {
      display: flex;
      justify-content: space-between;
      color: var(--cyan);
      font-size: 0.62rem;
      margin-bottom: 3px;
    }
    .h-txt {
      color: #cbd5e1;
      line-height: 1.3;
      margin-bottom: 5px;
      user-select: text;
    }
    .h-btn {
      background: #162133;
      color: var(--neon);
      border: 1px solid #2b3f5c;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.63rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="playerRoot" class="player-wrapper">
    <!-- Botão Mágico para destacar como Janelinha Flutuante sem abas de navegador -->
    <button class="popout-banner" onclick="launchFloatingMiniPlayer()">
      🚀 DESTACAR MINI-PLAYER PEQUENO (SEM ABA / NO TOPO)
    </button>

    <div class="player-shell" id="playerShell">
      <div class="screw tl"></div>
      <div class="screw tr"></div>
      <div class="screw bl"></div>
      <div class="screw br"></div>

      <!-- Cabeçalho do Mini Player -->
      <div class="top-bar" id="dragHeader" title="Arraste para mover ou clique em Destacar">
        <div class="brand">
          <div id="led" class="led"></div>
          <div>
            <span class="brand-title">TYON-V45 // COOK45 + NIKO</span>
            <span class="brand-sub" id="statusTxt">DUAL-MALE NEURAL ATIVO</span>
          </div>
        </div>
        <div class="top-actions">
          <button id="btnCompact" class="icon-btn" onclick="toggleCompactMode()" title="Encolher/Expandir gavetas">
            ➖ MINI
          </button>
          <button id="btnPin" class="icon-btn active" onclick="onTopActionClick()" title="Fixar Sempre no Topo sobre qualquer programa">
            📌 TOPO
          </button>
        </div>
      </div>

      <!-- Visor LCD + Osciloscópio + Analisador -->
      <div class="lcd-screen">
        <canvas id="miniScope" width="330" height="82"></canvas>
        <div class="lcd-info">
          <span id="voiceLabel">COOK45: Antonio (-8Hz)</span>
          <span id="kiloLabel" style="color:var(--cyan);">NIKO: Brian (-2Hz)</span>
        </div>
        <div class="lcd-marquee" id="captionBar">
          Pronto — tudo que o cook45 e o Niko responderem você ouve aqui!
        </div>
      </div>

      <!-- Botões Principais estilo Media Player -->
      <div class="transport-bar">
        <button class="t-btn play" onclick="readLast()">
          ▶ COOK45
        </button>
        <button class="t-btn niko" onclick="readLastKilo()">
          🤖 LER NIKO
        </button>
        <button class="t-btn" onclick="testVoice()">
          ⚡ TESTAR
        </button>
        <button class="t-btn stop" onclick="stopAudio()">
          ⏹ PARAR
        </button>
      </div>

      <!-- Chaves Rápidas -->
      <div class="quick-toggles">
        <div id="pillPower" class="q-pill on" onclick="toggleFlag('enabled')">
          🔊 SOM: ON
        </div>
        <div id="pillChat" class="q-pill on" onclick="toggleFlag('auto_read_chat')">
          💬 COOK: ON
        </div>
        <div id="pillKilo" class="q-pill on-niko" onclick="toggleFlag('auto_read_kilo')">
          🤖 NIKO: ON
        </div>
        <div id="pillClip" class="q-pill" onclick="toggleFlag('clipboard_watch')">
          📋 CTRL+C
        </div>
      </div>

      <!-- Corpo Expansível -->
      <div id="expandableBody">
        <div class="tabs-bar">
          <button class="tab-btn active" id="tabBtn-voice" onclick="openTab('voice')">🎛️ VOZ/TOM</button>
          <button class="tab-btn" id="tabBtn-speak" onclick="openTab('speak')">🎙️ DIGITAR</button>
          <button class="tab-btn" id="tabBtn-hist" onclick="openTab('hist')">📜 HISTÓRICO</button>
        </div>

        <!-- Gaveta 1: Voz do Cook45 + Voz do Niko + Sliders -->
        <div class="drawer open" id="drawer-voice">
          <div class="ctrl-row">
            <label><span style="color:var(--neon); font-weight:bold;">VOZ DO COOK45 (DIREITA):</span></label>
            <select id="selVoice" onchange="onPresetChange()">
              <option value="pt-BR-AntonioNeural" data-pitch="-1" data-rate="3">Cook45 Humanizado (Antonio PT-BR Natural -1Hz)</option>
              <option value="pt-BR-AntonioNeural" data-pitch="0" data-rate="0">Cook45 Puro (Antonio PT-BR 100% Limpo 0Hz)</option>
              <option value="pt-BR-AntonioNeural" data-pitch="-6" data-rate="8">Cook45 Grave (Antonio -6Hz)</option>
              <option value="en-US-AndrewMultilingualNeural" data-pitch="-1" data-rate="3">Cook45 Andrew (Masculino Natural -1Hz)</option>
            </select>
          </div>

          <div class="ctrl-row">
            <label><span style="color:var(--cyan); font-weight:bold;">VOZ DO NIKO / KILO CODE (ESQUERDA):</span></label>
            <select id="selKiloVoice" onchange="onKiloPresetChange()">
              <option value="en-US-BrianMultilingualNeural" data-pitch="+0Hz" data-rate="+4%">Niko Masculino 1 (Brian Neural Natural)</option>
              <option value="en-US-AndrewMultilingualNeural" data-pitch="+0Hz" data-rate="+3%">Niko Masculino 2 (Andrew Neural Natural)</option>
              <option value="pt-BR-AntonioNeural" data-pitch="+4Hz" data-rate="+8%">Niko Masculino 3 (Antonio Jovem +4Hz)</option>
              <option value="fr-FR-RemyMultilingualNeural" data-pitch="+0Hz" data-rate="+4%">Niko Masculino 4 (Remy Neural)</option>
              <option value="pt-PT-DuarteNeural" data-pitch="+0Hz" data-rate="+3%">Niko Masculino 5 (Duarte Neural)</option>
            </select>
          </div>

          <div class="ctrl-row">
            <label><span>VELOCIDADE (RATE)</span><strong id="lblRate">+3%</strong></label>
            <input type="range" id="rngRate" min="-25" max="45" value="3" oninput="syncLabels()" onchange="pushConfig()" />
          </div>
          <div class="ctrl-row">
            <label><span>GRAVE / PITCH</span><strong id="lblPitch">-1Hz</strong></label>
            <input type="range" id="rngPitch" min="-20" max="15" value="-1" oninput="syncLabels()" onchange="pushConfig()" />
          </div>
          <div class="ctrl-row">
            <label><span>VOLUME</span><strong id="lblVol">100%</strong></label>
            <input type="range" id="rngVol" min="10" max="100" value="100" oninput="syncLabels()" onchange="pushConfig()" />
          </div>
        </div>

        <!-- Gaveta 2: Transmissor de Texto Manual -->
        <div class="drawer" id="drawer-speak">
          <textarea id="miniText" placeholder="Cole ou digite qualquer texto aqui para ouvir..."></textarea>
          <div style="display:flex; gap:6px;">
            <button class="t-btn play" style="flex:1;" onclick="speakCustom()">🎙️ FALAR AGORA</button>
            <button class="t-btn" onclick="document.getElementById('miniText').value=''">LIMPAR</button>
          </div>
        </div>

        <!-- Gaveta 3: Histórico de Áudios com Replay -->
        <div class="drawer" id="drawer-hist">
          <div class="hist-box" id="histBox">
            <div style="color:var(--muted); font-size:0.7rem;">Sem transmissões ainda.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="browserPlayer" style="display:none;"></audio>

  <script>
    let stateCache = {
      enabled: true,
      auto_read_chat: true,
      auto_read_kilo: true,
      clipboard_watch: false,
      voice: 'pt-BR-AntonioNeural',
      rate: '+10%',
      pitch: '-8Hz',
      kilo_voice: 'en-US-BrianMultilingualNeural',
      kilo_rate: '+12%',
      kilo_pitch: '-2Hz',
      volume: 100,
      speaking: false
    };
    const browserPlayer = document.getElementById('browserPlayer');
    const LOCAL_BRIDGE = 'http://127.0.0.1:8091';

    let isPinnedTop = true;

    // Se já abriu em popup pequeno ou janela de app, ativa o modo flutuante compacto
    if (window.opener || window.innerWidth <= 430 || location.search.includes('popup=1')) {
      document.body.classList.add('floating-mode');
      try { window.resizeTo(368, 560); } catch (e) {}
    }

    async function onTopActionClick() {
      if (!document.body.classList.contains('floating-mode')) {
        return launchFloatingMiniPlayer();
      }
      isPinnedTop = !isPinnedTop;
      const btn = document.getElementById('btnPin');
      btn.className = 'icon-btn' + (isPinnedTop ? ' active' : '');
      btn.textContent = isPinnedTop ? '📌 TOPO' : '🔓 LIVRE';
      try {
        await apiFetch('/api/pin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pinned: isPinnedTop })
        });
      } catch (e) {}
    }

    // Dispara o App Independente Sempre no Topo no Windows (fica sobre qualquer tela mesmo fechando o Chrome!)
    async function launchFloatingMiniPlayer() {
      // 1. Aciona o protocolo nativo registrado no Windows (tyonvoice://open) para abrir fora do Chrome com HWND_TOPMOST
      try {
        const f = document.createElement('iframe');
        f.style.display = 'none';
        f.src = 'tyonvoice://open';
        document.body.appendChild(f);
        setTimeout(() => f.remove(), 2000);
      } catch (e) {}

      // 2. Também avisa o daemon local caso esteja em sessão interativa
      try {
        await apiFetch('/api/spawn_floating', { method: 'POST' });
      } catch (e) {}
    }

    function toggleCompactMode() {
      const bodyEl = document.getElementById('expandableBody');
      const btn = document.getElementById('btnCompact');
      const isCollapsed = bodyEl.classList.toggle('collapsed');
      btn.textContent = isCollapsed ? '➕ ABRIR' : '➖ MINI';
    }

    // Arraste livre quando está na página grande
    const rootWrapper = document.getElementById('playerRoot');
    const dragHeader = document.getElementById('dragHeader');
    let dragging = false, sx = 0, sy = 0, cx = 0, cy = 0;

    dragHeader.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON' || document.body.classList.contains('floating-mode')) return;
      dragging = true;
      sx = e.clientX - cx;
      sy = e.clientY - cy;
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      cx = e.clientX - sx;
      cy = e.clientY - sy;
      rootWrapper.style.transform = `translate(${cx}px, ${cy}px)`;
    });
    window.addEventListener('mouseup', () => { dragging = false; });

    function webSpeechFallback(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR';
      u.rate = 1.1;
      u.pitch = 0.85;
      u.onstart = () => { stateCache.speaking = true; };
      u.onend = () => { stateCache.speaking = false; };
      window.speechSynthesis.speak(u);
    }

    async function apiFetch(path, opts = {}) {
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        try {
          const r = await fetch(LOCAL_BRIDGE + path, opts);
          if (r.ok) return r;
        } catch (e) {}
      }
      return await fetch(path, opts);
    }

    const cvs = document.getElementById('miniScope');
    const c = cvs.getContext('2d');
    let ph = 0;
    function drawScope() {
      const w = cvs.width, h = cvs.height;
      c.fillStyle = '#04070b';
      c.fillRect(0, 0, w, h);

      c.strokeStyle = 'rgba(0,255,157,0.06)';
      for (let x = 0; x < w; x += 24) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }

      c.beginPath();
      c.strokeStyle = stateCache.speaking ? '#ffae00' : '#00ff9d';
      c.lineWidth = 2.2;
      for (let x = 0; x < w; x++) {
        const env = Math.sin((x / w) * Math.PI);
        const amp = stateCache.speaking
          ? (Math.sin(x * 0.07 + ph * 3) * 18 + Math.cos(x * 0.17 - ph * 4) * 11) * env
          : Math.sin(x * 0.04 + ph) * 2.2 * env;
        const y = h / 2 + amp;
        if (x === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.stroke();
      ph += stateCache.speaking ? 0.18 : 0.04;
      requestAnimationFrame(drawScope);
    }
    drawScope();

    function openTab(name) {
      ['voice', 'speak', 'hist'].forEach(t => {
        const d = document.getElementById('drawer-' + t);
        const b = document.getElementById('tabBtn-' + t);
        if (t === name) {
          const isAlreadyOpen = d.classList.contains('open');
          d.classList.toggle('open', !isAlreadyOpen);
          b.classList.toggle('active', !isAlreadyOpen);
        } else {
          d.classList.remove('open');
          b.classList.remove('active');
        }
      });
    }

    function syncLabels() {
      const r = parseInt(document.getElementById('rngRate').value, 10);
      const p = parseInt(document.getElementById('rngPitch').value, 10);
      const v = parseInt(document.getElementById('rngVol').value, 10);
      document.getElementById('lblRate').textContent = (r >= 0 ? '+' : '') + r + '%';
      document.getElementById('lblPitch').textContent = (p >= 0 ? '+' : '') + p + 'Hz';
      document.getElementById('lblVol').textContent = v + '%';
    }

    function onPresetChange() {
      const sel = document.getElementById('selVoice');
      const opt = sel.options[sel.selectedIndex];
      if (opt && opt.dataset.pitch) {
        document.getElementById('rngPitch').value = parseInt(opt.dataset.pitch, 10);
        document.getElementById('rngRate').value = parseInt(opt.dataset.rate, 10);
        syncLabels();
      }
      pushConfig();
    }

    async function onKiloPresetChange() {
      const sel = document.getElementById('selKiloVoice');
      const opt = sel.options[sel.selectedIndex];
      const kv = sel.value;
      const kp = opt ? (opt.dataset.pitch || '-2Hz') : '-2Hz';
      const kr = opt ? (opt.dataset.rate || '+12%') : '+12%';
      await apiFetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kilo_voice: kv, kilo_pitch: kp, kilo_rate: kr })
      });
    }

    async function toggleFlag(key) {
      stateCache[key] = !stateCache[key];
      renderPills();
      await apiFetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [key]: stateCache[key] })
      });
    }

    function renderPills() {
      const pPower = document.getElementById('pillPower');
      pPower.className = 'q-pill' + (stateCache.enabled ? ' on' : '');
      pPower.style.borderColor = stateCache.enabled ? 'var(--neon)' : 'var(--danger)';
      pPower.style.color = stateCache.enabled ? 'var(--neon)' : 'var(--danger)';
      pPower.textContent = stateCache.enabled ? '▶ PLAY: LIGADO' : '⏸ DESLIGADO';

      const pChat = document.getElementById('pillChat');
      pChat.className = 'q-pill' + (stateCache.auto_read_chat ? ' on' : '');
      pChat.textContent = stateCache.auto_read_chat ? '💬 COOK: ON' : '💬 COOK: OFF';

      const pKilo = document.getElementById('pillKilo');
      pKilo.className = 'q-pill' + (stateCache.auto_read_kilo !== false ? ' on-niko' : '');
      pKilo.textContent = stateCache.auto_read_kilo !== false ? '🤖 NIKO: ON' : '🤖 NIKO: OFF';

      const pClip = document.getElementById('pillClip');
      pClip.className = 'q-pill' + (stateCache.clipboard_watch ? ' on' : '');
      pClip.textContent = stateCache.clipboard_watch ? '📋 CTRL+C: ON' : '📋 CTRL+C';
    }

    async function pushConfig() {
      syncLabels();
      const r = parseInt(document.getElementById('rngRate').value, 10);
      const p = parseInt(document.getElementById('rngPitch').value, 10);
      const v = parseInt(document.getElementById('rngVol').value, 10);
      await apiFetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          voice: document.getElementById('selVoice').value,
          rate: (r >= 0 ? '+' : '') + r + '%',
          pitch: (p >= 0 ? '+' : '') + p + 'Hz',
          volume: v
        })
      });
    }

    async function readLast() {
      await apiFetch('/api/read_last', { method: 'POST' });
    }

    async function readLastKilo() {
      await apiFetch('/api/read_last_kilo', { method: 'POST' });
    }

    async function testVoice() {
      const text = 'Aqui é o cook45 na voz grave veterana. E o Niko também está conectado na segunda linha masculina!';
      document.getElementById('captionBar').textContent = text;
      const res = await apiFetch('/api/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, source: 'Mini Player Teste', play_on_host: true })
      });
      const d = await res.json();
      if (d.cloud_speak) webSpeechFallback(d.cloud_speak);
      else await apiFetch('/api/read_last_kilo', { method: 'POST' });
    }

    async function speakCustom() {
      const text = document.getElementById('miniText').value.trim();
      if (!text) return;
      document.getElementById('captionBar').textContent = text;
      const res = await apiFetch('/api/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, source: 'Mini Player Manual', play_on_host: true })
      });
      const d = await res.json();
      if (d.cloud_speak) webSpeechFallback(d.cloud_speak);
    }

    async function stopAudio() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      browserPlayer.pause();
      await apiFetch('/api/stop', { method: 'POST' });
    }

    function replayUrl(url) {
      if (!url) return;
      const base = (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') ? LOCAL_BRIDGE : '';
      browserPlayer.src = base + url + '?t=' + Date.now();
      browserPlayer.play().catch(() => {});
    }

    async function poll() {
      try {
        const res = await apiFetch('/api/state');
        const data = await res.json();
        const st = data.state;
        stateCache = st;

        const led = document.getElementById('led');
        led.className = 'led' + (!st.enabled ? ' off' : (st.speaking ? ' speaking' : ''));
        document.getElementById('statusTxt').textContent = !st.enabled
          ? 'PLAY DESLIGADO (SILENCIOSO)'
          : (st.speaking ? 'TRANSMITINDO ÁUDIO...' : 'PLAY LIGADO — ESCUTANDO');

        document.getElementById('voiceLabel').textContent = 'COOK45: ' + (st.voice || '').replace('pt-BR-', '').replace('en-US-', '').replace('Neural', '');
        document.getElementById('kiloLabel').textContent = 'NIKO: ' + (st.kilo_voice || 'Brian').replace('en-US-', '').replace('pt-BR-', '').replace('MultilingualNeural', '').replace('Neural', '');

        if (st.current_text) {
          document.getElementById('captionBar').textContent = st.current_text;
        }

        renderPills();

        if (st.history && st.history.length > 0) {
          document.getElementById('histBox').innerHTML = st.history.slice(0, 12).map(h => `
            <div class="h-item">
              <div class="h-meta"><span>[${h.timestamp}] ${h.source}</span></div>
              <div class="h-txt">${h.text}</div>
              <div>
                ${h.audio_url ? `<button class="h-btn" onclick="replayUrl('${h.audio_url}')">▶ OUVIR</button>` : ''}
                ${h.audio_url ? `<a class="h-btn" href="${h.audio_url}" download>⬇ MP3</a>` : ''}
              </div>
            </div>
          `).join('');
        }
      } catch (e) {}
    }

    setInterval(poll, 600);
    poll();
  </script>
</body>
</html>
